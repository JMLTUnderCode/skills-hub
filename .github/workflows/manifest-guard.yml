name: Manifest guard

on:
    push:
        branches:
            - main
        paths:
            - "skills/**"
            - "skills.config.json"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    guard:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Regenerar manifest
              run: node scripts/build-manifest.mjs

            - name: Confirmar manifest o commitear corrección
              run: |
                  if git diff --quiet -- manifest.json; then
                    echo "manifest.json en línea"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add manifest.json
                  git commit -m "chore: regenerate manifest.json"
                  git push
