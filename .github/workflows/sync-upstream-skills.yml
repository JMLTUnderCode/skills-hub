name: Sync upstream skills

on:
    schedule:
        - cron: "17 6 * * *"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout del repositorio
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Configurar pnpm
              uses: pnpm/action-setup@v4

            - name: Instalar dependencias
              run: pnpm install --frozen-lockfile

            - name: Detectar cambios en upstream
              id: detect
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  STATE_FILE=".github/upstream-sync-state.json"
                  LAST_SHA=$(node -e "const fs=require('fs');const p='$STATE_FILE';if(!fs.existsSync(p)){process.stdout.write('');process.exit(0);}const j=JSON.parse(fs.readFileSync(p,'utf8'));process.stdout.write(j.lastSyncedSha||'');")
                  UPSTREAM_SHA=$(gh api -X GET repos/Jeffallan/claude-skills/commits -f sha=main -f path=plugin/skills -F per_page=1 --jq '.[0].sha')
                  echo "last_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
                  echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
                  if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "Sin cambios upstream en plugin/skills"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                    echo "Cambios detectados: $LAST_SHA -> $UPSTREAM_SHA"
                  fi

            - name: Sincronizar skills desde upstream
              id: sync
              if: steps.detect.outputs.changed == 'true'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  GH_TOKEN: ${{ github.token }}
                  SUMMARY_FILE: ${{ runner.temp }}/sync-summary.json
              run: |
                  set -euo pipefail
                  node scripts/sync-upstream-skills.mjs --json > "$SUMMARY_FILE"
                  cat "$SUMMARY_FILE"
                  node --input-type=commonjs -e "const fs=require('fs');const p=process.env.SUMMARY_FILE;const s=JSON.parse(fs.readFileSync(p,'utf8'));const out=['changed='+s.changed,'added='+s.added.length,'updated='+s.updated.length,'removed='+s.removedUpstream.length].join(String.fromCharCode(10))+String.fromCharCode(10);fs.appendFileSync(process.env.GITHUB_OUTPUT,out);"

            - name: Normalizar formato de archivos generados
              if: steps.sync.outputs.changed == 'true'
              run: |
                  pnpm exec biome check --write skills.config.json manifest.json .github/upstream-sync-state.json

            - name: Ejecutar validaciones de formato y pruebas
              if: steps.sync.outputs.changed == 'true'
              run: |
                  pnpm run check
                  pnpm run test

            - name: Construir cuerpo del pull request
              if: steps.sync.outputs.changed == 'true'
              id: body
              env:
                  SUMMARY_FILE: ${{ runner.temp }}/sync-summary.json
                  PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
              run: |
                  node --input-type=commonjs - "$SUMMARY_FILE" "$PR_BODY_FILE" <<'NODE'
                  const fs = require('fs');
                  const [summaryFile, bodyFile] = process.argv.slice(2);
                  const s = JSON.parse(fs.readFileSync(summaryFile, 'utf8'));
                  const fmt = (arr) => (arr.length ? arr.map((x) => `- \`${x}\``).join('\n') : '- Ninguna');
                  const body = [
                    '## Sincronización automática de skills desde upstream',
                    '',
                    `- Fuente: \`${s.source?.repository || 'Jeffallan/claude-skills'}\` @ \`${s.source?.ref || 'main'}\` (${s.source?.path || 'plugin/skills'})`,
                    `- SHA upstream: \`${s.upstreamSha}\``,
                    '',
                    '### Skills nuevas (asignar categoría)',
                    fmt(s.added),
                    '',
                    '### Skills actualizadas',
                    fmt(s.updated),
                    '',
                    '### Skills eliminadas en upstream (no eliminadas localmente)',
                    fmt(s.removedUpstream),
                    '',
                    '### Skills ignoradas por sync.ignore',
                    fmt(s.ignored),
                    '',
                    'Revisa la categoría `Por asignar` en `skills.config.json` antes de fusionar.',
                  ].join('\n');
                  fs.writeFileSync(bodyFile, body);
                  console.log(body);
                  NODE

            - name: Crear o actualizar pull request de sincronización
              if: steps.sync.outputs.changed == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ github.token }}
                  branch: sync-skills
                  base: main
                  title: "chore(sync): sincronizar skills desde upstream"
                  body-path: ${{ runner.temp }}/pr-body.md
                  commit-message: "chore(sync): sincronizar skills desde upstream"
                  add-paths: |
                      skills/**
                      skills.config.json
                      manifest.json
                      .github/upstream-sync-state.json
